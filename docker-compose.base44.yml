services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - preview-data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
    command: ["node", "--watch", "server/index.js"]
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

volumes:
  preview-data:
