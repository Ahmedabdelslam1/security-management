services:
  web:
    image: node:22-slim
    working_dir: /app
    # Live-reload dev host: Code.gs is recompiled on every request and node --watch
    # restarts on harness changes.
    command: ["node", "--watch", "harness/server.js"]
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HARNESS_DATA_DIR=/data
      - HARNESS_TZ=Africa/Cairo
      - TZ=Africa/Cairo
    volumes:
      - .:/app
      - gas_data:/data
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/__gas/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  gas_data:
