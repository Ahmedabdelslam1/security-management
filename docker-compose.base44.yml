# Base44 dev environment.
#
# The repo is a Google Apps Script web app: Code.gs is the backend and
# Index.html is the UI, and it normally only runs inside Google's servers.
# dev/ ships a local Apps Script runtime (Node standard library only) so the
# real Code.gs + Index.html run here, with Sheets/Drive emulated on disk.
#
# Runs from the cloned source with a live-reload watcher; no prebuilt images.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "--watch", "--watch-path=/app/Code.gs", "--watch-path=/app/dev", "dev/server.mjs"]
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - NODE_ENV=development
      - TZ=Africa/Cairo
    volumes:
      - ./:/app
      - app_data:/data
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  app_data:
