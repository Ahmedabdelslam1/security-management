<script>
/* ================= أدوات مساعدة ================= */

var TOKEN = localStorage.getItem('sec_token') || '';
var USER = null;
var WORKERS = [];
var DAY_WORKERS = [];
var dayRecords = {};
var LAST_PERIOD = null;
var LAST_WORKER_REPORT = null;
var LAST_LOCATION_REPORT = null;
var LAST_SUMMARY = null;
var LAST_SETTLEMENT = null;

function gs(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(new Error((e && e.message) || 'حدث خطأ')); })
      [fn].apply(null, args);
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

var toastTimer = null;
function showMsg(txt, isErr) {
  var t = document.getElementById('toast');
  t.textContent = txt;
  t.className = 'toast show ' + (isErr ? 'err' : '');
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, isErr ? 5000 : 3000);
}

function fail(e) { showMsg(e && e.message ? e.message : 'حدث خطأ', true); }

function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalWrap').classList.add('open');
}
function closeModal() { document.getElementById('modalWrap').classList.remove('open'); }

function confirmBox(message, onYes) {
  openModal('<h3>تأكيد</h3><p style="margin-bottom:16px;line-height:1.6">' + esc(message) + '</p>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn danger block" id="cbYes">تأكيد</button>' +
    '<button class="btn block" onclick="closeModal()">إلغاء</button></div>');
  document.getElementById('cbYes').onclick = function () { closeModal(); onYes(); };
}

function promptBox(message, onSave, placeholder) {
  openModal('<h3 style="margin-bottom:10px">' + esc(message) + '</h3>' +
    '<input id="pbVal" class="inp" placeholder="' + esc(placeholder || '') + '">' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<button class="btn primary block" id="pbOk">حفظ</button>' +
    '<button class="btn block" onclick="closeModal()">إلغاء</button></div>');
  document.getElementById('pbVal').focus();
  document.getElementById('pbOk').onclick = function () {
    var v = document.getElementById('pbVal').value;
    closeModal(); onSave(v);
  };
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function fmtDate(s) {
  if (!s) return '';
  var p = String(s).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s;
}

function imgThumb(id) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w800'; }

function isAllowed(perm) { return USER && (USER.role === 'admin' || USER.permissions[perm]); }

function notesWithExtra(x) {
  var n = String((x && x.notes) || '');
  var xh = Number((x && x.extraHours) || 0);
  return (xh ? 'ساعات إضافية: ' + xh + '. ' : '') + n;
}

function printHTML(title, innerHtml) {
  var w = window.open('', '_blank');
  if (!w) { showMsg('يرجى السماح بالنوافذ المنبثقة لتفعيل الطباعة', true); return; }
  var style = ''
    + '@page{size:A4;margin:14mm}'
    + 'body{font-family:"Times New Roman",Times,serif;color:#000;background:#fff;margin:0 auto;max-width:190mm;font-size:12.5px}'
    + 'h2{text-align:center;margin:0 0 6px;font-size:16px;font-weight:bold}'
    + '.meta{text-align:center;color:#000;margin-bottom:10px;font-size:12.5px}'
    + 'table{width:100%;border-collapse:collapse;margin:8px auto}'
    + 'thead{display:table-header-group}'
    + 'tfoot{display:table-footer-group}'
    + 'th,td{border:1px solid #000;padding:5px 7px;text-align:center;font-size:12.5px;color:#000}'
    + 'thead th{background:#2563eb;color:#fff;font-weight:bold}'
    + 'tbody tr:nth-child(even){background:#eaf0fc}'
    + 'tbody tr:nth-child(odd){background:#fff}'
    + 'td b{font-weight:bold}'
    + 'tfoot th{font-weight:bold;border:1px solid #000;background:#cfe0fb}'
    + 'img.thumb{max-height:50px;max-width:50px}'
    + '.pfoot{display:flex;justify-content:space-between;margin-top:30px;font-weight:bold;font-size:13px}'
    + '.pfoot .pl{margin-right:auto;margin-left:0}'
    + '@media print{.noprint{display:none}}';
  var footer = '<div class="pfoot"><span>تحريرًا في: ' + fmtDate(todayStr()) + '</span>' +
    '<span class="pl">يعتمد</span></div>';
  w.document.write('<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>' + title +
    '</title><style>' + style + '</style></head><body>' +
    innerHtml + footer +
    '<script>setTimeout(function(){window.print();},400);<\/script></body></html>');
  w.document.close();
}

/* ================= الساعة ================= */

var CLOCK_TIMER = null;
var WEEKDAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function startClock() {
  if (CLOCK_TIMER) return;
  CLOCK_TIMER = setInterval(updateClock, 1000);
  updateClock();
}

function updateClock() {
  var d = new Date();
  var wd = WEEKDAYS_AR[d.getDay()];
  var dateStr = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  var h = d.getHours(), ap = h < 12 ? 'ص' : 'م';
  h = h % 12 || 12;
  var time = ('0' + h).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) + ' ' + ap;

  var lv = document.getElementById('loginWeekday');
  if (lv) {
    lv.textContent = wd;
    document.getElementById('loginDate').textContent = dateStr;
    document.getElementById('loginDigital').textContent = time;
    var s = d.getSeconds(), m = d.getMinutes(), hr = d.getHours() % 12;
    document.getElementById('chS').style.transform = 'rotate(' + (s * 6) + 'deg)';
    document.getElementById('chM').style.transform = 'rotate(' + ((m + s / 60) * 6) + 'deg)';
    document.getElementById('chH').style.transform = 'rotate(' + ((hr + m / 60) * 30) + 'deg)';
  }
  var cb = document.getElementById('clockBar');
  if (cb) cb.innerHTML = wd + ' ' + dateStr + ' <span class="cd">' + time + '</span>';
}

/* ================= بدء التشغيل ================= */

document.addEventListener('DOMContentLoaded', init);

function init() {
  document.getElementById('attDate').value = todayStr();
  ['perFrom', 'perTo', 'rwFrom', 'rlFrom', 'rsFrom', 'setFrom', 'setTo'].forEach(function (id) {
    var d = new Date(); d.setDate(1);
    var s = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-01';
    document.getElementById(id).value = s;
  });
  ['perTo', 'rwTo', 'rlTo', 'rsTo', 'setTo'].forEach(function (id) {
    document.getElementById(id).value = todayStr();
  });

  if (TOKEN) {
    gs('apiSession', TOKEN).then(function (r) {
      USER = r.user;
      showApp();
    }).catch(function () {
      TOKEN = ''; localStorage.removeItem('sec_token');
      showLogin();
    });
  } else {
    showLogin();
  }
  startClock();
}

function showLogin() {
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
}

function showApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('hdrName').textContent = USER.name || USER.username;
  buildNav();
  var first = NAV_TABS.length ? NAV_TABS[0][0] : null;
  if (first) switchTab(first);
  loadLocations();
  refreshWorkers();
}

/* ================= الدخول / التسجيل ================= */

function showAuthTab(which) {
  document.getElementById('authLogin').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('authReg').style.display = which === 'reg' ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabReg').classList.toggle('active', which === 'reg');
  document.getElementById('authMsg').textContent = '';
}

function setAuthMsg(txt, ok) {
  var m = document.getElementById('authMsg');
  m.textContent = txt;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

function doLogin() {
  var u = document.getElementById('liUser').value.trim();
  var p = document.getElementById('liPass').value;
  if (!u || !p) return setAuthMsg('برجاء إدخال اسم المستخدم وكلمة المرور', false);
  gs('apiLogin', u, p).then(function (r) {
    TOKEN = r.token; USER = r.user;
    localStorage.setItem('sec_token', TOKEN);
    document.getElementById('liPass').value = '';
    showApp();
  }).catch(function (e) { setAuthMsg(e.message, false); });
}

function doRegister() {
  var n = document.getElementById('rgName').value.trim();
  var u = document.getElementById('rgUser').value.trim();
  var ph = document.getElementById('rgPhone').value.trim();
  var p = document.getElementById('rgPass').value;
  gs('apiRegister', n, u, p, ph).then(function (msg) {
    setAuthMsg(msg, true);
    ['rgName', 'rgUser', 'rgPhone', 'rgPass'].forEach(function (id) { document.getElementById(id).value = ''; });
  }).catch(function (e) { setAuthMsg(e.message, false); });
}

function doLogout() {
  gs('apiLogout', TOKEN).catch(function () {});
  TOKEN = ''; USER = null;
  localStorage.removeItem('sec_token');
  showLogin();
}

function openChangePass() {
  openModal('<h3>&#128273; تغيير كلمة المرور</h3>' +
    '<input id="cpOld" class="inp" type="password" placeholder="كلمة المرور الحالية">' +
    '<input id="cpNew" class="inp" type="password" placeholder="كلمة المرور الجديدة">' +
    '<button class="btn primary block" onclick="doChangePass()">حفظ</button>');
}

function doChangePass() {
  gs('apiChangePassword', TOKEN,
      document.getElementById('cpOld').value, document.getElementById('cpNew').value)
    .then(function (m) { closeModal(); showMsg(m); })
    .catch(fail);
}

  var tabs = [];
  if (isAllowed('attendance')) tabs.push(['attendance', 'الحضور']);
  if (isAllowed('attendance')) tabs.push(['settlement', 'التسوية']);
  if (isAllowed('workers')) tabs.push(['workers', 'العاملين']);
  if (isAllowed('reports')) tabs.push(['reports', 'التقارير']);
  if (USER.role === 'admin') tabs.push(['users', 'المستخدمين']);
  if (USER.role === 'admin') tabs.push(['monitor', 'المتابعة']);
  var ICONS = { attendance: '\uD83D\uDCCB', settlement: '\uD83D\uDCB0', workers: '\uD83D\uDC65', reports: '\uD83D\uDCCA', users: '\uD83D\uDC64', monitor: '\uD83D\uDDA5' };
  var nav = document.getElementById('mainNav');
  nav.innerHTML = tabs.map(function (t) {
    return '<button class="ntab" id="nav-' + t[0] + '" onclick="switchTab(\'' + t[0] + '\')">' +
      '<span class="nic">' + (ICONS[t[0]] || '') + '</span><span>' + t[1] + '</span></button>';
  }).join('');

var NAV_TABS = [];

var TAB_LABELS = { attendance: 'الحضور', settlement: 'التسوية',
  workers: 'العاملين', reports: 'التقارير', users: 'المستخدمين', monitor: 'المتابعة' };

/* ================= أدوات سريعة: آلة حاسبة متقدمة + تصوير الشاشة ================= */

var CALC_EXPR = '';
var CALC_MEM = 0;

function calcBtn(label, fn) {
  return '<button class="btn" style="font-size:17px;padding:12px 0" onclick="' + fn + '">' + label + '</button>';
}

function openCalculator() {
  openModal(
    '<h3>الآلة الحاسبة</h3>' +
    '<div id="calcDisplay" style="background:var(--card2);border:1px solid var(--line);border-radius:10px;' +
      'padding:14px;margin-bottom:10px;text-align:left;direction:ltr;font-size:26px;font-weight:700;' +
      'min-height:38px;overflow-x:auto;white-space:nowrap">0</div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' +
      calcBtn('MC', 'calcMemClear()') + calcBtn('MR', 'calcMemRecall()') + calcBtn('M+', 'calcMemAdd()') + calcBtn('M-', 'calcMemSub()') +
      calcBtn('C', 'calcClear()') + calcBtn('&#9003;', 'calcBackspace()') + calcBtn('%', 'calcPercent()') + calcBtn('&divide;', "calcAppend('/')") +
      calcBtn('7', "calcAppend('7')") + calcBtn('8', "calcAppend('8')") + calcBtn('9', "calcAppend('9')") + calcBtn('&times;', "calcAppend('*')") +
      calcBtn('4', "calcAppend('4')") + calcBtn('5', "calcAppend('5')") + calcBtn('6', "calcAppend('6')") + calcBtn('&minus;', "calcAppend('-')") +
      calcBtn('1', "calcAppend('1')") + calcBtn('2', "calcAppend('2')") + calcBtn('3', "calcAppend('3')") + calcBtn('+', "calcAppend('+')") +
      calcBtn('&radic;', 'calcSqrt()') + calcBtn('0', "calcAppend('0')") + calcBtn('.', "calcAppend('.')") + calcBtn('=', 'calcEval()') +
    '</div>'
  );
}

function calcRefresh() {
  var d = document.getElementById('calcDisplay');
  if (d) d.textContent = CALC_EXPR || '0';
}

function calcAppend(v) {
  CALC_EXPR = (CALC_EXPR === '0' || CALC_EXPR === '') ? String(v) : CALC_EXPR + v;
  calcRefresh();
}

function calcClear() { CALC_EXPR = ''; calcRefresh(); }

function calcBackspace() { CALC_EXPR = CALC_EXPR.slice(0, -1); calcRefresh(); }

function calcSafeEval(expr) {
  if (!expr) return 0;
  if (!/^[0-9+\-*/.() ]+$/.test(expr)) throw new Error('bad expression');
  return Function('"use strict";return (' + expr + ')')();
}

function calcPercent() {
  try { CALC_EXPR = String(calcSafeEval(CALC_EXPR) / 100); calcRefresh(); }
  catch (e) { showMsg('عملية غير صحيحة', true); }
}

function calcSqrt() {
  try { CALC_EXPR = String(Math.sqrt(calcSafeEval(CALC_EXPR || '0'))); calcRefresh(); }
  catch (e) { showMsg('عملية غير صحيحة', true); }
}

function calcEval() {
  try { CALC_EXPR = String(calcSafeEval(CALC_EXPR)); calcRefresh(); }
  catch (e) { CALC_EXPR = ''; var d = document.getElementById('calcDisplay'); if (d) d.textContent = 'خطأ'; }
}

function calcMemAdd() { try { CALC_MEM += calcSafeEval(CALC_EXPR || '0'); } catch (e) {} }
function calcMemSub() { try { CALC_MEM -= calcSafeEval(CALC_EXPR || '0'); } catch (e) {} }
function calcMemRecall() { CALC_EXPR = String(CALC_MEM); calcRefresh(); }
function calcMemClear() { CALC_MEM = 0; }

function captureScreen() {
  if (typeof html2canvas === 'undefined') { showMsg('تعذر تحميل أداة التصوير، تحقق من الاتصال بالإنترنت', true); return; }
  var target = document.querySelector('main') || document.getElementById('appView');
  showMsg('جاري تصوير الشاشة...');
  html2canvas(target, { backgroundColor: '#ffffff', scale: 2, useCORS: true }).then(function (canvas) {
    var link = document.createElement('a');
    link.download = 'لقطة-شاشة-' + todayStr() + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showMsg('تم حفظ لقطة الشاشة');
  }).catch(function () { showMsg('تعذر تصوير الشاشة', true); });
}

function switchTab(name) {
  ['attendance', 'settlement', 'workers', 'reports', 'users', 'monitor'].forEach(function (s) {
    var el = document.getElementById('sec-' + s);
    if (el) el.style.display = s === name ? 'block' : 'none';
    var nt = document.getElementById('nav-' + s);
    if (nt) nt.classList.toggle('active', s === name);
  });
  if (TOKEN && USER) gs('apiLogPage', TOKEN, TAB_LABELS[name] || name).catch(function () {});
  if (name === 'attendance') loadDay();
  if (name === 'settlement') loadLocations();
  if (name === 'workers') refreshWorkers();
  if (name === 'reports') { loadLocations(); refreshReportWorkers(); }
  if (name === 'users') refreshUsers();
  if (name === 'monitor') refreshMonitor();
}

/* ================= الحضور ================= */

function showAttSub(which) {
  document.getElementById('attDayWrap').style.display = which === 'day' ? 'block' : 'none';
  document.getElementById('attPeriodWrap').style.display = which === 'period' ? 'block' : 'none';
  document.getElementById('stDay').classList.toggle('active', which === 'day');
  document.getElementById('stPeriod').classList.toggle('active', which === 'period');
}

function loadDay() {
  var date = document.getElementById('attDate').value || todayStr();
  gs('apiGetDay', TOKEN, date).then(function (r) {
    DAY_WORKERS = r.workers;
    dayRecords = {};
    r.records.forEach(function (rec) { dayRecords[rec.workerId] = rec; });
    renderDay();
  }).catch(fail);
}

function renderDay() {
  var body = document.getElementById('attBody');
  if (!DAY_WORKERS.length) {
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا يوجد عاملين مضافين بعد</td></tr>';
    return;
  }
  var STATUSES = ['حضور', 'بدل يوم', 'يوم + وقت اضافى', 'مبيت'];
  body.innerHTML = DAY_WORKERS.map(function (w) {
    var rec = dayRecords[w.id] || {};
    var st = rec.status || 'حضور';
    var needsExtra = (st === 'مبيت' || st === 'يوم + وقت اضافى');
    return '<tr data-wid="' + w.id + '" data-name="' + esc(w.name) + '">' +
      '<td><b>' + esc(w.name) + '</b></td>' +
      '<td><select class="st" onchange="toggleExtra(this)"><option value="--">--</option>' +
        STATUSES.map(function (s) {
          return '<option value="' + s + '"' + (st === s ? ' selected' : '') + '>' + s + '</option>';
        }).join('') + '</select></td>' +
      '<td><input class="loc" list="locList" value="' + esc(rec.location || '') + '" placeholder="مكان الحضور" oninput="locChanged(this)"></td>' +
      '<td class="unset">' + w.unsettled + '</td>' +
      '<td class="ncell">' +
        '<span class="xhwrap"' + (needsExtra ? '' : ' style="display:none"') + '>ساعات إضافية ' +
        '<input class="xh" type="number" min="0" step="0.5" value="' + (rec.extraHours || '') + '"></span>' +
        '<input class="note" value="' + esc(rec.notes || '') + '" placeholder="ملاحظات">' +
      '</td>' +
      '</tr>';
  }).join('');
}

var EXTRA_STATUSES = ['مبيت', 'يوم + وقت اضافى'];

function locChanged(inp) {
  var tr = inp.closest('tr');
  var st = tr.querySelector('.st');
  if (inp.value.trim() && st.value === '--') {
    st.value = 'حضور';
    toggleExtra(st);
  }
}

function toggleExtra(sel) {
  var tr = sel.closest('tr');
  var wrap = tr.querySelector('.xhwrap');
  var xh = tr.querySelector('.xh');
  if (EXTRA_STATUSES.indexOf(sel.value) !== -1) {
    wrap.style.display = 'flex';
    if (!xh.value) xh.value = 0;
  } else {
    wrap.style.display = 'none';
    xh.value = '';
  }
}

function saveDay() {
  var date = document.getElementById('attDate').value;
  if (!date) return showMsg('برجاء تحديد التاريخ', true);
  var rows = document.querySelectorAll('#attBody tr[data-wid]');
  var records = [];
  rows.forEach(function (tr) {
    var st = tr.querySelector('.st').value;
    if (st === '--') return;
    var wid = tr.getAttribute('data-wid');
    var w = DAY_WORKERS.filter(function (x) { return x.id === wid; })[0] || {};
    records.push({
      workerId: wid,
      workerName: tr.getAttribute('data-name'),
      status: st,
      location: tr.querySelector('.loc').value,
      wage: Number(w.dailyWage) || 0,
      extraHours: EXTRA_STATUSES.indexOf(st) !== -1 ? (Number(tr.querySelector('.xh').value) || 0) : 0,
      notes: tr.querySelector('.note').value
    });
  });
  gs('apiSaveDay', TOKEN, date, records).then(function (m) {
    showMsg(m);
    loadDay();
    loadLocations();
  }).catch(fail);
}

function printAttendanceDay() {
  var date = document.getElementById('attDate').value;
  var rows = DAY_WORKERS.map(function (w) {
    var rec = dayRecords[w.id] || {};
    var tr = document.querySelector('#attBody tr[data-wid="' + w.id + '"]');
    var status = tr ? tr.querySelector('.st').value : (rec.status || '--');
    var loc = tr ? tr.querySelector('.loc').value : (rec.location || '');
    var note = notesWithExtra(rec);
    if (tr) note = tr.querySelector('.note').value ||
      (tr.querySelector('.xh') && tr.querySelector('.xh').value ? 'ساعات إضافية: ' + tr.querySelector('.xh').value : '');
    return '<tr><td>' + esc(w.name) + '</td><td>' + esc(status) + '</td><td>' + esc(loc) + '</td><td>' +
      w.unsettled + '</td><td>' + esc(note) + '</td></tr>';
  }).join('');
  var present = DAY_WORKERS.filter(function (w) {
    var rec = dayRecords[w.id] || {};
    var tr = document.querySelector('#attBody tr[data-wid="' + w.id + '"]');
    var status = tr ? tr.querySelector('.st').value : (rec.status || '--');
    return status !== '--';
  }).length;
  var unsettledSum = DAY_WORKERS.reduce(function (s, w) { return s + w.unsettled; }, 0);
  var html = '<h2>تسجيل حضور العاملين</h2><div class="meta">التاريخ: ' + fmtDate(date) + '</div>' +
    '<table><thead><tr><th>اسم العامل</th><th>الموقف</th><th>مكان الحضور</th>' +
    '<th>المستحق</th><th>ملاحظات</th></tr></thead><tbody>' + (rows || '') +
    '</tbody><tfoot><tr><th>الإجمالي</th><th>' + present + '</th><th></th><th>' + unsettledSum +
    '</th><th></th></tr></tfoot></table>';
  printHTML('تسجيل حضور - ' + date, html);
}

/* --- عرض فترة سابقة --- */

function loadPeriod() {
  var from = document.getElementById('perFrom').value;
  var to = document.getElementById('perTo').value;
  if (!from || !to) return showMsg('برجاء تحديد الفترة من - إلى', true);
  gs('apiGetPeriod', TOKEN, from, to).then(function (r) {
    LAST_PERIOD = r;
    WORKERS = r.workers;
    var sel = document.getElementById('perWorker');
    sel.innerHTML = '<option value="">جميع العاملين</option>' +
      r.workers.map(function (w) { return '<option value="' + w.id + '">' + esc(w.name) + '</option>'; }).join('');
    renderPeriod(r.rows, from, to);
  }).catch(fail);
}

function reRenderPeriod() {
  if (LAST_PERIOD) renderPeriod(LAST_PERIOD.rows, LAST_PERIOD.from, LAST_PERIOD.to);
}

function renderPeriod(rows, from, to, selectedWorker) {
  var body = document.getElementById('perBody');
  selectedWorker = selectedWorker || document.getElementById('perWorker').value;
  var html = '';
  if (!selectedWorker) {
    if (!rows.length) {
      html = '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا توجد سجلات خلال هذه الفترة</td></tr>';
    } else {
      html = rows.map(function (r) { return periodRow(r.date, r.workerName, r.status, r.location, r.extraHours, r.notes); }).join('');
    }
  } else {
    var map = {};
    rows.forEach(function (r) { if (r.workerId === selectedWorker) map[r.date] = r; });
    var d = new Date(from), end = new Date(to), parts = [];
    while (d <= end) {
      var ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      var r = map[ds];
      var name = (WORKERS.filter(function (w) { return w.id === selectedWorker; })[0] || {}).name || '';
      parts.push(periodRow(ds, name, r ? r.status : '--', r ? r.location : '', r ? r.extraHours : '', r ? r.notes : ''));
      d.setDate(d.getDate() + 1);
    }
    html = parts.length ? parts.join('') :
      '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا توجد سجلات</td></tr>';
  }
  body.innerHTML = html;
}

function periodRow(date, name, status, loc, xh, notes) {
  return '<tr><td>' + fmtDate(date) + '</td><td>' + esc(name) + '</td>' +
    '<td style="color:' + (status !== '--' ? 'var(--ok)' : 'var(--mut)') + '">' + esc(status) + '</td>' +
    '<td>' + esc(loc) + '</td><td>' + esc((xh ? 'ساعات إضافية: ' + xh + '. ' : '') + (notes || '')) + '</td></tr>';
}

function printPeriodTable() {
  var from = document.getElementById('perFrom').value, to = document.getElementById('perTo').value;
  var trs = Array.prototype.map.call(document.querySelectorAll('#perBody tr'), function (tr) {
    return '<tr>' + Array.prototype.map.call(tr.querySelectorAll('td'), function (td) {
      return '<td>' + esc(td.textContent.trim()) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  var trEls = Array.prototype.slice.call(document.querySelectorAll('#perBody tr'));
  var cnt = trEls.filter(function (tr) {
    var tds = tr.querySelectorAll('td');
    return tds.length >= 3 && tds[2].textContent.trim() !== '--' && tds[2].textContent.trim() !== '';
  }).length;
  var html = '<h2>سجل الحضور - فترة سابقة</h2><div class="meta">من ' + fmtDate(from) + ' إلى ' + fmtDate(to) + '</div>' +
    '<table><thead><tr><th>التاريخ</th><th>اسم العامل</th><th>الموقف</th><th>مكان الحضور</th>' +
    '<th>ملاحظات</th></tr></thead><tbody>' + trs +
    '</tbody><tfoot><tr><th colspan="4">إجمالي سجلات الحضور</th><th>' + cnt + '</th></tr></tfoot></table>';
  printHTML('سجل الحضور', html);
}

/* ================= التسوية ================= */

function loadSettlement() {
  var from = document.getElementById('setFrom').value;
  var to = document.getElementById('setTo').value;
  var loc = document.getElementById('setLoc').value;
  if (!from || !to) return showMsg('برجاء تحديد الفترة من - إلى', true);
  gs('apiGetSettlement', TOKEN, from, to, loc).then(function (r) {
    LAST_SETTLEMENT = r;
    renderSettlement();
  }).catch(fail);
}

function renderSettlement() {
  var s = LAST_SETTLEMENT;
  document.getElementById('setTotals').innerHTML =
    tbox('عدد العاملين', s.rows.length) + tbox('إجمالي الأيام', s.totalDays) + tbox('الإجمالي', s.totalAmount);
  document.getElementById('setBody').innerHTML = s.rows.map(function (r) {
    return '<tr data-wid="' + r.workerId + '" style="' + (r.settled ? 'opacity:.55' : '') + '">' +
      '<td><input type="checkbox" class="setChk"' + (r.settled ? '' : ' checked') + '></td>' +
      '<td>' + esc(r.workerName) + '</td><td>' + r.days + '</td><td>' + r.wage + '</td>' +
      '<td>' + r.total + '</td></tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا توجد سجلات خلال هذه الفترة</td></tr>';
  document.getElementById('setLetterBtn').disabled = !s.location;
}

function toggleAllSettle(checked) {
  document.querySelectorAll('.setChk').forEach(function (c) { c.checked = checked; });
}

function settleSelected() {
  var to = document.getElementById('setTo').value;
  var ids = [];
  document.querySelectorAll('#setBody tr[data-wid]').forEach(function (tr) {
    if (tr.querySelector('.setChk').checked) ids.push(tr.getAttribute('data-wid'));
  });
  if (!ids.length) return showMsg('برجاء تحديد عامل واحد على الأقل', true);
  confirmBox('تسوية ' + ids.length + ' عامل حتى تاريخ ' + fmtDate(to) + '؟', function () {
    gs('apiSettleBulk', TOKEN, ids, to).then(function (m) {
      showMsg(m); loadSettlement(); refreshWorkers();
    }).catch(fail);
  });
}

function printSettlementTable() {
  var s = LAST_SETTLEMENT;
  if (!s) return showMsg('اعرض الجدول أولاً', true);
  var rows = s.rows.map(function (r) {
    return '<tr><td>' + esc(r.workerName) + '</td><td>' + r.days + '</td><td>' + r.wage + '</td>' +
      '<td>' + r.total + '</td></tr>';
  }).join('');
  var html = '<h2>تسوية العاملين</h2><div class="meta">من ' + fmtDate(s.from) + ' إلى ' + fmtDate(s.to) +
    (s.location ? (' | مكان الحضور: ' + esc(s.location)) : ' | جميع الأماكن') + '</div>' +
    '<table><thead><tr><th>اسم العامل</th><th>عدد الأيام</th><th>أجر اليوم</th>' +
    '<th>الإجمالي</th></tr></thead><tbody>' + (rows || '') +
    '</tbody><tfoot><tr><th>الإجمالي</th><th>' + s.totalDays + '</th><th></th><th>' + s.totalAmount +
    '</th></tr></tfoot></table>';
  printHTML('تسوية العاملين', html);
}

function printApprovalLetter() {
  var s = LAST_SETTLEMENT;
  if (!s || !s.location) return showMsg('برجاء اختيار مكان حضور محدد أولاً لإصدار خطاب الاعتماد', true);
  var rowsHtml = s.rows.map(function (r) {

function previewImg(input, prevId) {
  var f = input.files[0];
  var img = document.getElementById(prevId);
  if (!f) { img.style.display = 'none'; return; }
  var rd = new FileReader();
  rd.onload = function () { img.src = rd.result; img.style.display = 'block'; };
  rd.readAsDataURL(f);
}

function fileToB64(file) {
  return new Promise(function (res, rej) {
    var img = new Image();
    var rd = new FileReader();
    rd.onload = function () {
      img.onload = function () {
        var max = 1200, sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.onerror = function () { rej(new Error('تعذر قراءة الصورة')); };
      img.src = rd.result;
    };
    rd.onerror = function () { rej(new Error('تعذر قراءة الملف')); };
    rd.readAsDataURL(file);
  });
}

function saveWorker() {
  var data = {
    id: editWorkerId,
    name: document.getElementById('wmName').value.trim(),
    cardNumber: document.getElementById('wmCardNo').value.trim(),
    phone: document.getElementById('wmPhone').value.trim(),
    dailyWage: Number(document.getElementById('wmWage').value) || 0,
    workHours: Number(document.getElementById('wmHours').value) || 8
  };
  if (!data.name) return showMsg('اسم العامل مطلوب', true);
  var cardFile = document.getElementById('wmCardImg').files[0];
  var photoFile = document.getElementById('wmPhoto').files[0];
  var btn = document.querySelector('#modalBox .primary');
  btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
  Promise.all([
    cardFile ? fileToB64(cardFile) : Promise.resolve(null),
    photoFile ? fileToB64(photoFile) : Promise.resolve(null)
  ]).then(function (arr) {
    if (arr[0]) data.cardImgB64 = arr[0];
    if (arr[1]) data.photoB64 = arr[1];
    return gs('apiSaveWorker', TOKEN, data);
  }).then(function (m) {
    closeModal(); showMsg(m); refreshWorkers();
  }).catch(function (e) {
    fail(e);
    btn.disabled = false; btn.textContent = 'حفظ';
  });
}

function runWorkerReport(workerId, from, to, inModal) {
  if (inModal) {
    gs('apiReportByWorker', TOKEN, workerId, from, to).then(function (r) {
      var wk = WORKERS.filter(function (w) { return w.id === workerId; })[0] || {};
      var hourly = (Number(wk.dailyWage) || 0) / ((Number(wk.workHours) || 8) || 8);
      r.rows.forEach(function (x) {
        x.value = Math.round(((Number(x.wage) || 0) + (Number(x.extraHours) || 0) * hourly) * 100) / 100;
      });
      var box = document.getElementById('modalRepBox');
      box.innerHTML = '<div class="totals">' +
        tbox('عدد الأيام', r.days) + tbox('أجر اليوم', r.wage) + tbox('الإجمالي', r.total) + '</div>' +
        '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الموقف</th><th>مكان الحضور</th><th>القيمة</th><th>ملاحظات</th></tr></thead><tbody>' +
        r.rows.map(function (x) {

        }).join('') +
        (r.rows.length ? '' : '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا توجد سجلات</td></tr>') +
        '</tbody></table></div>';
    }).catch(fail);
    return;
  }
  workerId = workerId || document.getElementById('rwWorker').value;
  from = from || document.getElementById('rwFrom').value;
  to = to || document.getElementById('rwTo').value;
  if (!workerId) return showMsg('برجاء اختيار العامل', true);
  gs('apiReportByWorker', TOKEN, workerId, from, to).then(function (r) {
    r.workerName = (WORKERS.filter(function (w) { return w.id === workerId; })[0] || {}).name || '';
    r.from = from; r.to = to;
    var wk = WORKERS.filter(function (w) { return w.id === workerId; })[0] || {};
    var hourly = (Number(wk.dailyWage) || 0) / ((Number(wk.workHours) || 8) || 8);
    r.rows.forEach(function (x) {
      x.value = Math.round(((Number(x.wage) || 0) + (Number(x.extraHours) || 0) * hourly) * 100) / 100;

    }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا توجد سجلات خلال الفترة</td></tr>';
  }).catch(fail);

function renderMonitor() {
  document.getElementById('monUsersBody').innerHTML = MON.users.map(function (u) {
    return '<tr><td>' + esc(u.name || u.username) + '</td><td>' + esc(u.lastLogin || '--') + '</td>' +
      '<td>' + esc(u.lastSeen || '--') + '</td>' +
      '<td>' + (u.online ? '<span class="dot-on"></span><span style="color:var(--ok)">متصل الآن</span>' :
        '<span class="dot-off"></span><span style="color:var(--mut)">غير متصل</span>') + '</td>' +
      '<td>' + u.actions + '</td></tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا يوجد نشاط بعد</td></tr>';

  document.getElementById('monLogBody').innerHTML = MON.log.map(function (l) {
    return '<tr><td>' + esc(l.time) + '</td><td>' + esc(l.name || l.username) + '</td>' +
      '<td>' + esc(l.action) + '</td><td>' + esc(l.page) + '</td><td>' + esc(l.details) + '</td></tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--mut)">لا يوجد سجل بعد</td></tr>';
}

function printMonitor() {
  if (!MON) return showMsg('اعرض البيانات أولاً', true);
  var uRows = MON.users.map(function (u) {
    return '<tr><td>' + esc(u.name || u.username) + '</td><td>' + esc(u.lastLogin || '--') + '</td>' +
      '<td>' + esc(u.lastSeen || '--') + '</td><td>' + (u.online ? 'متصل الآن' : 'غير متصل') + '</td>' +
      '<td>' + u.actions + '</td></tr>';
  }).join('');
  var lRows = MON.log.map(function (l) {
    return '<tr><td>' + esc(l.time) + '</td><td>' + esc(l.name || l.username) + '</td>' +
      '<td>' + esc(l.action) + '</td><td>' + esc(l.page) + '</td><td>' + esc(l.details) + '</td></tr>';
  }).join('');
  var html = '<h2>متابعة المستخدمين وسجل النشاط</h2>' +
    '<table><thead><tr><th>المستخدم</th><th>آخر دخول</th><th>آخر نشاط</th><th>الاتصال</th><th>عدد الإجراءات</th></tr></thead><tbody>' +
    (uRows || '') + '</tbody><tfoot><tr><th colspan="4">إجمالي الإجراءات</th><th>' +
    MON.users.reduce(function (s, u) { return s + (Number(u.actions) || 0); }, 0) + '</th></tr></tfoot></table>' +
    '<h3 style="margin:14px 0 4px">سجل الإجراءات</h3>' +
    '<table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>الصفحة</th><th>التفاصيل</th></tr></thead><tbody>' +
    (lRows || '') + '</tbody><tfoot><tr><th colspan="4">إجمالي السجلات</th><th>' + MON.log.length + '</th></tr></tfoot></table>';
  printHTML('متابعة المستخدمين', html);
}

/* ================= المستخدمين (للمدير) ================= */

var USERS = [];

function showUsersSub(which) {
  document.getElementById('usersListWrap').style.display = which === 'list' ? 'block' : 'none';
  document.getElementById('usersNewWrap').style.display = which === 'new' ? 'block' : 'none';
  document.getElementById('usList').classList.toggle('active', which === 'list');
  document.getElementById('usNew').classList.toggle('active', which === 'new');
}

function refreshUsers() {
  gs('apiGetUsers', TOKEN).then(function (us) { USERS = us; renderUsers(); }).catch(fail);
}

function statusLabel(s) {
  return s === 'approved' ? '<span style="color:var(--ok)">معتمد</span>' :
         s === 'pending' ? '<span style="color:var(--warn)">بانتظار الموافقة</span>' :
         '<span style="color:var(--bad)">موقوف</span>';
}

function renderUsers() {
  document.getElementById('usersBody').innerHTML = USERS.map(function (u) {
    var p = u.permissions || {};
    return '<tr data-uid="' + u.id + '">' +
      '<td>' + esc(u.name) + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.phone) + '</td>' +
      '<td>' + (u.role === 'admin' ? 'مدير' : 'مستخدم') + '</td>' +
      '<td>' + statusLabel(u.status) + '</td>' +
      '<td class="perm-cell">' +
        '<label class="chk"><input type="checkbox" class="pm-all" onchange="toggleAllPerms(this)"> كل الشاشات</label> ' +
        '<label class="chk"><input type="checkbox" class="pm-w"' + (p.workers ? ' checked' : '') + '> العاملين</label> ' +
        '<label class="chk"><input type="checkbox" class="pm-a"' + (p.attendance ? ' checked' : '') + '> الحضور</label> ' +
        '<label class="chk"><input type="checkbox" class="pm-r"' + (p.reports ? ' checked' : '') + '> التقارير</label> ' +
      '</td>' +
      '<td style="white-space:nowrap">' +
        (u.status !== 'approved' ? '<button class="btn small" onclick="setUStatus(\'' + u.id + '\',\'approved\')">موافقة</button> ' : '') +
        (u.status === 'approved' ? '<button class="btn small danger" onclick="setUStatus(\'' + u.id + '\',\'suspended\')">إيقاف</button> ' : '') +
        (u.status === 'suspended' ? '<button class="btn small" onclick="setUStatus(\'' + u.id + '\',\'approved\')">تنشيط</button> ' : '') +
        '<button class="btn small" onclick="savePerms(\'' + u.id + '\')">حفظ الصلاحيات</button> ' +
        '<button class="btn small" onclick="resetUserPass(\'' + u.id + '\')">كلمة مرور</button> ' +
        '<button class="btn small danger" onclick="delUser(\'' + u.id + '\')">حذف</button>' +
      '</td></tr>';
  }).join('');
}

function setUStatus(id, status) {
  gs('apiSetUserStatus', TOKEN, id, status).then(function (m) { showMsg(m); refreshUsers(); }).catch(fail);
}

function toggleAllPerms(box) {
  var tr = box.closest('tr');
  tr.querySelectorAll('.pm-w,.pm-a,.pm-r').forEach(function (c) { c.checked = box.checked; });
}

function npToggleAll(box) {
  ['npWorkers', 'npAtt', 'npRep'].forEach(function (id) {
    document.getElementById(id).checked = box.checked;
  });
}

function savePerms(id) {
  var tr = document.querySelector('tr[data-uid="' + id + '"]');
  var perms = {
    workers: tr.querySelector('.pm-w').checked,
    attendance: tr.querySelector('.pm-a').checked,
    reports: tr.querySelector('.pm-r').checked
  };
  gs('apiSetPermissions', TOKEN, id, perms).then(function (m) { showMsg(m); refreshUsers(); }).catch(fail);
}

function resetUserPass(id) {
  promptBox('كلمة المرور الجديدة (4 أحرف على الأقل):', function (np) {
    if (!np) return;
    gs('apiResetUserPassword', TOKEN, id, np).then(function (m) { showMsg(m); }).catch(fail);
  });
}

function delUser(id) {
  confirmBox('حذف هذا الحساب نهائيًا؟', function () {
    gs('apiDeleteUser', TOKEN, id).then(function (m) { showMsg(m); refreshUsers(); }).catch(fail);
  });
}

function resetAllData() {
  promptBox('تصفير البرنامج كله سيحذف كل العاملين والحضور والتسويات والأماكن نهائيًا بدون أي رجوع. اكتب "تصفير" للتأكيد:', function (v) {
    if (v !== 'تصفير') return showMsg('لم يتم التصفير، النص غير مطابق', true);
    gs('apiResetAllData', TOKEN).then(function (m) {
      showMsg(m); refreshWorkers(); loadLocations();
    }).catch(fail);
  });
}

function createUser() {
  var allChecked = document.getElementById('npAll').checked;
  var perms = {
    workers: allChecked || document.getElementById('npWorkers').checked,
    attendance: allChecked || document.getElementById('npAtt').checked,
    reports: allChecked || document.getElementById('npRep').checked,
    users: document.getElementById('npAdmin').checked
  };
  var role = document.getElementById('npAdmin').checked ? 'admin' : 'user';
  var name = document.getElementById('nuName').value.trim();
  var username = document.getElementById('nuUser').value.trim();
  var pass = document.getElementById('nuPass').value;
  if (!name || !username || !pass) return showMsg('برجاء إكمال البيانات', true);
  gs('apiCreateUser', TOKEN, name, username, pass,
      document.getElementById('nuPhone').value.trim(), perms, role)
    .then(function (m) {
      showMsg(m);
      ['nuName', 'nuUser', 'nuPhone', 'nuPass'].forEach(function (id) { document.getElementById(id).value = ''; });
      showUsersSub('list'); refreshUsers();
    }).catch(fail);
}

/* ربط Enter بتسجيل الدخول */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && document.getElementById('loginView').style.display !== 'none') doLogin();
});
</script>
