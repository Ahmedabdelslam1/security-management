name: بناء تطبيق أندرويد (APK)
on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد ملفات الأندرويد الناقصة (مرة واحدة)
        run: |
          cp -r lib /tmp/lib_backup
          flutter create --platforms android --org eg.security --project-name security_management .
          rm -rf lib && mv /tmp/lib_backup lib

      - run: flutter pub get
      - name: flutter build apk --debug
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../build.log || { grep -E "(Error|error)" ../build.log | grep -E "lib/|\.dart" | head -15 | sed 's/^/::error::/'; exit 1; }

      - name: رفع ملف الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: security-management-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: نشر الـ APK على الإصدار ليتحدث التطبيق تلقائيًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/security-management.apk
          gh release upload v1.0-android /tmp/security-management.apk --clobber --repo "${{ github.repository }}"

      - name: نشر الـ APK على الإصدار ليتحدث التطبيق تلقائيًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/security-management.apk
          gh release upload v1.0-android /tmp/security-management.apk --clobber --repo "${{ github.repository }}"
