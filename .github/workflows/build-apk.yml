name: بناء تطبيق أندرويد (APK)
on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد ملفات الأندرويد الناقصة (مرة واحدة)
        run: |
          cp -r lib /tmp/lib_backup
          flutter create --platforms android --org eg.security --project-name security_management .
          rm -rf lib && mv /tmp/lib_backup lib
          sed -i 's/android:label="[^"]*"/android:label="إدارة الأمن"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: توليد أيقونة التطبيق من اللوجو
        run: flutter pub run flutter_launcher_icons

      - run: flutter build apk --debug

      - name: رفع ملف الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: security-management-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
